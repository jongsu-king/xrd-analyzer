# Builds the installers on each OS, verifies every frozen build with its built-in self-test
# and GUI smoke test, test-installs the Windows installer and the .deb, then publishes a
# GitHub Release (on tags v*).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, kind: macos }
          - { os: windows-latest, kind: windows }
          - { os: ubuntu-22.04, kind: linux }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Linux system libraries
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 fonts-noto-cjk
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,build]"
      - name: Tests
        run: pytest -q -p no:cacheprovider

      # ---------------------------------------------------------------- macOS
      - name: Build app + DMG (macOS)
        if: matrix.kind == 'macos'
        run: packaging/macos/build_dmg.sh
      - name: Verify frozen app and DMG (macOS)
        if: matrix.kind == 'macos'
        run: |
          set -e
          M="dist/XRD Analyzer.app/Contents/MacOS"
          "$M/xrd-analyzer-cli" selftest --out dist/selftest-macos.json
          "$M/XRD-Analyzer" gui-smoke --offscreen --out dist/gui-smoke-macos.json
          MP=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MP" dist/*.dmg
          "$MP/XRD Analyzer.app/Contents/MacOS/xrd-analyzer-cli" selftest --out dist/selftest-macos-dmg.json
          hdiutil detach "$MP"

      # -------------------------------------------------------------- Windows
      - name: Build app (Windows)
        if: matrix.kind == 'windows'
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/xrd-analyzer.spec
      - name: Verify frozen app (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          & dist\XRD-Analyzer\xrd-analyzer-cli.exe selftest --out dist\selftest-windows.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & dist\XRD-Analyzer\xrd-analyzer-cli.exe gui-smoke --offscreen --out dist\gui-smoke-windows.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build installer + portable zip (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = python -c "import xrd_analyzer; print(xrd_analyzer.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\xrd-analyzer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist\XRD-Analyzer -DestinationPath "dist\XRD-Analyzer-$v-windows-x64-portable.zip"
      - name: Silent install, self-test, uninstall (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\XRD-Analyzer-*-windows-x64-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/DIR=C:\xrd-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          & C:\xrd-test\xrd-analyzer-cli.exe selftest --out dist\selftest-windows-installed.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The Origin file type: registered, reaches the launcher (no Origin on this machine), and
          # removed on uninstall.
          if (-not (Test-Path 'HKCU:\Software\Classes\.xrdorigin')) { Write-Error 'file type not registered'; exit 1 }
          & C:\xrd-test\xrd-analyzer-cli.exe examples --out "$env:RUNNER_TEMP\ex"
          & C:\xrd-test\xrd-analyzer-cli.exe analyze "$env:RUNNER_TEMP\ex\synthetic_si_like.csv" --wavelength cu_ka1 --no-pdf --origin --out "$env:RUNNER_TEMP\or"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:XRD_NO_PAUSE = '1'
          & C:\xrd-test\xrd-analyzer-cli.exe open-in-origin "$env:RUNNER_TEMP\or\origin\open_in_origin.xrdorigin"
          if ($LASTEXITCODE -ne 9) { Write-Error "expected exit code 9 (Origin not found), got $LASTEXITCODE"; exit 1 }
          $global:LASTEXITCODE = 0
          $u = Start-Process -FilePath C:\xrd-test\unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { exit 1 }
          if (Test-Path 'HKCU:\Software\Classes\.xrdorigin') { Write-Error 'file type left behind'; exit 1 }
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii dist\windows.sha256

      # ---------------------------------------------------------------- Linux
      - name: Build tar.gz + deb (Linux)
        if: matrix.kind == 'linux'
        run: packaging/linux/build_linux.sh
      - name: Verify frozen app and installed deb (Linux)
        if: matrix.kind == 'linux'
        run: |
          set -e
          dist/XRD-Analyzer/xrd-analyzer-cli selftest --out dist/selftest-linux.json
          dist/XRD-Analyzer/XRD-Analyzer gui-smoke --offscreen --out dist/gui-smoke-linux.json
          sudo apt-get install -y ./dist/xrd-analyzer_*_amd64.deb
          xrd-analyzer selftest --out dist/selftest-linux-deb.json
          sudo apt-get remove -y xrd-analyzer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xrd-analyzer-${{ matrix.kind }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
            dist/*.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # to publish the release; nothing else in this workflow can write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verification && mv artifacts/*.json verification/
          (cd verification && zip -q ../artifacts/build-verification-reports.zip *.json)
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "XRD Analyzer $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
