[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrd-analyzer"
version = "0.1.3"
description = "Desktop and command-line analyzer for 1D θ–2θ X-ray diffraction patterns: baselines, peak fitting, d-spacing, Scherrer and Williamson–Hall, reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "XRD Analyzer contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
    "PySide6>=6.6",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
]
build = ["pyinstaller>=6.6", "pillow>=10"]

[project.scripts]
xrd-analyzer = "xrd_analyzer.cli:main"

[project.gui-scripts]
xrd-analyzer-gui = "xrd_analyzer.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: needs PySide6/Qt (runs offscreen)"]

[tool.coverage.run]
source = ["xrd_analyzer"]
omit = ["*/ui/*", "*/__main__.py", "*/selfupdate.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# selfupdate.py is a shared copy kept identical across the jongsu-king desktop
# programs (Python 3.8+); it is checked by its own tests, not restyled here.
extend-exclude = ["src/xrd_analyzer/selfupdate.py", "tests/test_selfupdate.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters (θ, β, λ) are intentional

[tool.mypy]
python_version = "3.11"
packages = ["xrd_analyzer"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["src/xrd_analyzer/ui/", "src/xrd_analyzer/selfupdate.py"]

[[tool.mypy.overrides]]
module = "xrd_analyzer.selfupdate"
ignore_errors = true
